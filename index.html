<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>學員AI分享牆｜聯成電腦</title>
<meta name="description" content="聯成電腦學員運用生成式 AI 完成的影像與影片作品。">
<meta property="og:title" content="學員AI分享牆｜聯成電腦">
<meta property="og:description" content="聯成電腦學員運用生成式 AI 完成的影像與影片作品。">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E9EAEC;
  --surface:#FFFFFF;
  --ink:#16171A;
  --muted:#6B6F76;
  --line:rgba(22,23,26,.13);
  --accent:#E8481C;
  --sans:"Noto Sans TC",-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang TC","Microsoft JhengHei",sans-serif;
  --serif:"Noto Serif TC","Songti TC",serif;
  --pad:clamp(20px,5vw,64px);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font-family:var(--sans);font-size:16px;line-height:1.7;
  -webkit-font-smoothing:antialiased;
}
img{display:block;max-width:100%}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px;border-radius:2px}

/* ---------- header ---------- */
.masthead{
  position:sticky;top:0;z-index:40;
  display:flex;align-items:center;gap:14px;
  padding:14px var(--pad);
  background:rgba(233,234,236,.92);
  backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line);
}
.mark{
  display:flex;align-items:baseline;gap:9px;
  font-weight:700;letter-spacing:.02em;text-decoration:none;color:inherit;
}
.mark b{font-size:17px}
.mark span{font-size:13px;color:var(--muted);font-weight:400}
.mark i{
  width:9px;height:9px;background:var(--accent);border-radius:50%;
  display:inline-block;font-style:normal;transform:translateY(-1px)
}

/* ---------- hero ---------- */
.hero{
  padding:clamp(44px,7vw,84px) var(--pad) clamp(30px,4vw,48px);
  display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr);
  gap:clamp(24px,4vw,56px);align-items:center;
}
.hero h1{
  font-family:var(--serif);font-weight:700;
  font-size:clamp(38px,6.6vw,74px);line-height:1.14;
  margin:0 0 20px;letter-spacing:.01em;
}
.hero p{margin:0;max-width:34em;color:#33363C;font-size:clamp(15px,1.6vw,17px)}
.tally{
  margin-top:26px;padding-top:18px;border-top:2px solid var(--ink);
  display:inline-flex;flex-wrap:wrap;gap:6px 22px;font-size:14px;color:var(--muted)
}
.tally b{color:var(--ink);font-weight:700}

/* pinned prints */
.wall{position:relative;height:clamp(220px,30vw,330px)}
.wall figure{
  position:absolute;margin:0;width:46%;
  background:var(--surface);padding:9px 9px 34px;
  border:1px solid var(--line);
  box-shadow:0 14px 28px -18px rgba(0,0,0,.5);
}
.wall figure:nth-child(1){left:0;top:8%;transform:rotate(-4.5deg)}
.wall figure:nth-child(2){left:27%;top:0;transform:rotate(1.5deg);z-index:2}
.wall figure:nth-child(3){right:0;top:14%;transform:rotate(5deg)}
.wall .slot{position:relative;width:100%;aspect-ratio:4/3;overflow:hidden;background:#D6D7DA}
.wall .slot>*{
  position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
  opacity:0;transition:opacity 1.3s ease
}
.wall .slot>.live{opacity:1}
.wall figcaption{
  position:absolute;left:9px;right:9px;bottom:9px;
  font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  padding-top:6px;transition:opacity .35s ease
}
.pin{
  position:absolute;top:-7px;left:50%;width:12px;height:12px;margin-left:-6px;
  background:var(--accent);border-radius:50%;
  box-shadow:0 2px 4px rgba(0,0,0,.35)
}

/* ---------- filters ---------- */
.filters{
  padding:6px var(--pad) 26px;
  display:flex;flex-wrap:wrap;gap:8px;align-items:center;
}
.chip{
  background:transparent;border:1px solid var(--line);border-radius:100px;
  padding:7px 16px;font-size:14px;transition:background .15s,border-color .15s,color .15s;
}
.chip:hover{border-color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.chip small{opacity:.6;margin-left:6px;font-size:12px}

/* ---------- grid ---------- */
.grid{
  padding:0 var(--pad) 90px;
  display:grid;gap:clamp(16px,2.2vw,28px);
  grid-template-columns:repeat(auto-fill,minmax(268px,1fr));
}
.card{
  background:var(--surface);border:1px solid var(--line);
  text-align:left;padding:0;overflow:hidden;
  display:flex;flex-direction:column;
  transition:transform .18s ease,box-shadow .18s ease;
}
.card:hover,.card:focus-visible{transform:translateY(-3px);box-shadow:0 18px 34px -22px rgba(0,0,0,.55)}
.thumb{position:relative;aspect-ratio:4/3;overflow:hidden;background:#DDDEE1}
.thumb img{width:100%;height:100%;object-fit:cover}
.badge{
  position:absolute;left:10px;top:10px;
  background:rgba(22,23,26,.82);color:#fff;
  font-size:11.5px;padding:4px 9px;border-radius:3px;letter-spacing:.03em
}
.play{
  position:absolute;right:10px;bottom:10px;
  display:flex;align-items:center;gap:5px;
  background:var(--accent);color:#fff;font-size:12px;padding:5px 11px;border-radius:100px;
  cursor:pointer;transition:transform .15s ease,box-shadow .15s ease;
  box-shadow:0 2px 8px -2px rgba(0,0,0,.5)
}
.play:hover{transform:scale(1.07);box-shadow:0 4px 12px -2px rgba(0,0,0,.6)}
.card-body{padding:15px 16px 18px;flex:1;display:flex;flex-direction:column;gap:5px}
.card-body h3{
  font-family:var(--serif);font-size:19px;font-weight:600;margin:0;line-height:1.4
}
.card-body .who{font-size:13.5px;color:var(--muted)}
.card-body .who b{color:var(--ink);font-weight:500}
.card-body .snip{
  font-size:13.5px;color:var(--muted);margin:4px 0 0;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden
}
.empty{
  grid-column:1/-1;padding:70px 0;text-align:center;color:var(--muted)
}
.empty b{display:block;color:var(--ink);font-size:19px;font-family:var(--serif);margin-bottom:8px}

/* placeholder art */
.ph{
  width:100%;height:100%;display:grid;place-items:center;text-align:center;
  padding:16px;font-size:13px;color:rgba(255,255,255,.94);line-height:1.5;
  font-family:var(--serif);word-break:break-word
}

/* ---------- detail overlay ---------- */
.veil{
  position:fixed;inset:0;z-index:60;background:rgba(14,15,17,.94);
  display:none;grid-template-columns:minmax(0,1fr) minmax(300px,352px);
}
.veil.on{display:grid}
body.locked{overflow:hidden}
.stage{
  position:relative;display:grid;place-items:center;padding:48px 14px 68px;min-width:0;
}
.stage .shot{max-width:100%;max-height:100%;object-fit:contain}
.stage .ph{max-width:520px;aspect-ratio:4/3;height:auto}
.stage .tube,.stage .shot-video{
  width:100%;max-width:calc((100vh - 128px) * 16 / 9);
  aspect-ratio:16/9;background:#000;border:0
}
.stage .tube{cursor:pointer}
.strip button{position:relative}
.vmark{
  position:absolute;inset:0;display:grid;place-items:center;
  background:rgba(0,0,0,.45);color:#fff;font-size:13px
}
.nav{
  position:absolute;top:50%;transform:translateY(-50%);
  width:46px;height:46px;border-radius:50%;
  background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.25);color:#fff;
  display:grid;place-items:center;font-size:20px;line-height:1;
  transition:background .15s
}
.nav:hover{background:rgba(255,255,255,.3)}
.nav[disabled]{opacity:.22;cursor:default}
.nav.prev{left:14px}
.nav.next{right:14px}
.counter{
  position:absolute;bottom:24px;left:50%;transform:translateX(-50%);
  color:rgba(255,255,255,.72);font-size:13px;letter-spacing:.06em
}
.strip{
  position:absolute;bottom:56px;left:50%;transform:translateX(-50%);
  display:flex;gap:7px
}
.strip button{
  width:44px;height:34px;padding:0;border:1px solid rgba(255,255,255,.25);
  background:rgba(255,255,255,.08);overflow:hidden;opacity:.5;transition:opacity .15s
}
.strip button[aria-current="true"]{opacity:1;border-color:#fff}
.strip img{width:100%;height:100%;object-fit:cover}
.strip .ph{font-size:0}

.panel{
  background:#141517;color:#EDEEF0;overflow-y:auto;padding:56px 34px 44px;
  border-left:1px solid rgba(255,255,255,.1)
}
.panel .tag{
  display:inline-block;font-size:12px;color:#fff;background:var(--accent);
  padding:3px 10px;border-radius:3px;margin-bottom:14px
}
.panel h2{font-family:var(--serif);font-size:27px;line-height:1.35;margin:0 0 6px;font-weight:600}
.panel .who{color:#9DA2AA;font-size:14px;margin:0 0 22px}
.panel .who b{color:#fff;font-weight:500}
.panel .desc{font-size:14.5px;line-height:1.85;color:#C9CCD2;white-space:pre-wrap;margin:0}
.panel h4{
  font-size:13px;color:#9DA2AA;font-weight:500;margin:30px 0 10px;
  padding-top:18px;border-top:1px solid rgba(255,255,255,.12)
}
.tube{
  position:relative;aspect-ratio:16/9;background:#000;overflow:hidden;
  display:grid;place-items:center;width:100%;border:0;padding:0
}
.tube img{width:100%;height:100%;object-fit:cover;opacity:.75}
.tube iframe{width:100%;height:100%;border:0}
.tube .btn{
  position:absolute;display:flex;align-items:center;gap:8px;
  background:var(--accent);color:#fff;padding:9px 18px;border-radius:100px;font-size:14px
}
.solo{
  position:absolute;top:12px;left:14px;z-index:2;
  display:flex;align-items:center;gap:7px;
  background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.25);color:#fff;
  padding:7px 15px;border-radius:100px;font-size:13px;transition:background .15s
}
.solo:hover{background:rgba(255,255,255,.3)}
.veil.focusmode{grid-template-columns:1fr}
.veil.focusmode .panel{display:none}
.veil.focusmode .stage .tube,.veil.focusmode .stage .shot-video{
  max-width:min(1400px, calc((100vh - 128px) * 16 / 9))
}
.shut{
  position:fixed;top:14px;right:16px;z-index:70;
  width:42px;height:42px;border-radius:50%;
  background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.25);color:#fff;
  font-size:19px;line-height:1;display:none;place-items:center
}
.veil.on ~ .shut{display:grid}

/* ---------- footer ---------- */
footer{
  padding:34px var(--pad) 60px;border-top:1px solid var(--line);
  font-size:13.5px;color:var(--muted);display:flex;flex-wrap:wrap;gap:8px 26px
}
footer a{color:var(--ink)}

/* ---------- admin ---------- */
#admin{display:none;padding:34px var(--pad) 70px;border-top:2px solid var(--ink);background:#DFE0E3}
#admin.on{display:block}
#admin h2{font-family:var(--serif);font-size:24px;margin:0 0 6px}
#admin>p{margin:0 0 22px;color:var(--muted);font-size:14px;max-width:52em}
.form{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));max-width:1000px}
.form label{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--muted)}
.form .wide{grid-column:1/-1}
.form input,.form textarea,.form select{
  font:inherit;font-size:14.5px;color:var(--ink);
  padding:9px 11px;border:1px solid var(--line);background:#fff;border-radius:3px
}
.form textarea{min-height:96px;resize:vertical;line-height:1.7}
.gen{
  margin-top:18px;background:var(--ink);color:#fff;border:0;
  padding:11px 24px;border-radius:100px;font-size:14.5px
}
#out{
  margin-top:18px;display:none;background:#141517;color:#D8DBE0;
  padding:18px;border-radius:4px;font-size:13px;line-height:1.7;
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
  white-space:pre;overflow-x:auto;max-width:1000px
}
#out.on{display:block}

/* ---------- responsive ---------- */
@media (max-width:860px){
  .hero{grid-template-columns:1fr}
  .wall{order:-1;height:250px}
  .veil.on{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) auto}
  .stage{padding:52px 10px 64px;min-height:46vh}
  .stage .tube,.stage .shot-video{max-width:100%}
  .panel{padding:24px 20px 36px;border-left:0;border-top:1px solid rgba(255,255,255,.1);max-height:44vh}
  .strip{display:none}
  .nav{width:40px;height:40px}
}
@media (prefers-reduced-motion:reduce){
  *{transition:none!important;animation:none!important}
  .wall .slot>*{opacity:0}
  .wall .slot>.live{opacity:1}
  .card:hover{transform:none}
}
</style>
</head>
<body>

<header class="masthead">
  <a class="mark" href="./"><i></i><b>聯成電腦</b><span>學員AI分享牆</span></a>
</header>

<section class="hero">
  <div>
    <h1>學員AI分享牆</h1>
    <p>這裡收錄聯成電腦學員運用生成式 AI 完成的影像與影片。點開任一件，可以逐張瀏覽，也可以直接播放影片。</p>
    <div class="tally" id="tally"></div>
  </div>
  <div class="wall" id="wall"></div>
</section>

<div class="filters" id="filters"></div>

<main class="grid" id="grid"></main>

<section id="admin">
  <h2>新增作品</h2>
  <p>填完按「產生程式碼」，把下方那段複製起來，貼到 index.html 裡 <code>作品資料</code> 清單的最前面（第一個 <code>{</code> 之前），存檔後重新上傳即可。這個面板只有網址加上 #edit 時才會出現，一般訪客看不到。</p>
  <div class="form">
    <label class="wide">作品名稱<input id="f-title" placeholder="拾墨文創 品牌商標設計"></label>
    <label>學員姓名<input id="f-name" placeholder="張文欣"></label>
    <label>課程名稱<input id="f-course" placeholder="平面設計"></label>
    <label>年份<input id="f-year" placeholder="2026"></label>
    <label class="wide">YouTube 影片網址，一行一支<textarea id="f-video" placeholder="https://youtu.be/xxxxxxxxxxx&#10;沒有影片就整格留空"></textarea></label>
    <label class="wide">作品說明<textarea id="f-desc" placeholder="使用的工具、提示詞方向、想呈現的效果⋯⋯（可留空）"></textarea></label>
    <label class="wide">圖片檔名，一行一張<textarea id="f-imgs" placeholder="images/shimo-01.jpg&#10;images/shimo-02.jpg"></textarea></label>
  </div>
  <button class="gen" id="gen">產生程式碼</button>
  <pre id="out"></pre>
</section>

<footer>
  <span>聯成電腦　學員AI分享牆</span>
  <span>作品著作權屬於各學員本人</span>
</footer>

<div class="veil" id="veil" role="dialog" aria-modal="true" aria-label="作品詳細內容">
  <div class="stage">
    <button class="solo" id="solo">⤢ 收合文案</button>
    <div id="shot-slot"></div>
    <button class="nav prev" id="prev" aria-label="上一張">‹</button>
    <button class="nav next" id="next" aria-label="下一張">›</button>
    <div class="strip" id="strip"></div>
    <div class="counter" id="counter"></div>
  </div>
  <aside class="panel" id="panel"></aside>
</div>
<button class="shut" id="shut" aria-label="關閉">✕</button>

<script>

const 色盤 = ["#2E4A62","#5B4B7A","#7A4A3C","#2F5D4E","#8A5A2B","#40485C","#6B3F52","#3C5A4A"];
const $ = (s,r=document)=>r.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function 影片ID(u){
  if(!u) return "";
  const m = String(u).match(/(?:youtu\.be\/|v=|embed\/|shorts\/)([A-Za-z0-9_-]{11})/);
  return m ? m[1] : (/^[A-Za-z0-9_-]{11}$/.test(u) ? u : "");
}
function 底圖(text,seed){
  const c = 色盤[Math.abs([...String(seed)].reduce((a,ch)=>a+ch.charCodeAt(0),0)) % 色盤.length];
  return `<div class="ph" style="background:${c}">${esc(text)}</div>`;
}
function 縮圖(w,i=0,cls=""){
  const src = w.圖片 && w.圖片[i];
  if(!src) return 底圖(w.作品, w.作品);
  return `<img class="${cls}" src="${esc(src)}" alt="${esc(w.作品)}" loading="lazy"
    data-ph="${esc(w.作品)}" onerror="圖失敗(this)">`;
}
window.圖失敗 = function(img){
  const t = img.getAttribute("data-ph") || "";
  img.outerHTML = 底圖(t, t);
};

function 投影片(w){
  const s = (w.圖片||[]).filter(Boolean).map(src=>({型:"圖", 值:src}));
  const vs = Array.isArray(w.影片) ? w.影片 : (w.影片 ? [w.影片] : []);
  vs.map(影片ID).filter(Boolean).forEach(v=>s.push({型:"影", 值:v}));
  return s;
}
function 有影片(w){ return 投影片(w).some(s=>s.型==="影"); }
function 封面(w,cls=""){
  const 首 = (w.圖片||[]).filter(Boolean)[0];
  if(首) return 縮圖(w,0,cls);
  const v = 投影片(w).find(s=>s.型==="影");
  if(v) return `<img class="${cls}" src="https://i.ytimg.com/vi/${v.值}/hqdefault.jpg" alt="${esc(w.作品)}" loading="lazy" data-ph="${esc(w.作品)}" onerror="圖失敗(this)">`;
  return 底圖(w.作品, w.作品);
}

/* ---------- 首頁 ---------- */
let 目前課程 = "全部";

let 牆源 = [], 牆指標 = [0,1,2], 牆輪 = 0, 牆計時 = null;

function 換格(k, w){
  const fig = $("#wall").children[k]; if(!fig) return;
  const slot = fig.querySelector(".slot"), cap = fig.querySelector("figcaption");
  const tmp = document.createElement("div");
  tmp.innerHTML = 封面(w);
  const el = tmp.firstElementChild; if(!el) return;
  slot.appendChild(el);
  requestAnimationFrame(()=>{
    [...slot.children].forEach(n=>{ if(n!==el) n.classList.remove("live"); });
    el.classList.add("live");
    cap.style.opacity = "0";
    setTimeout(()=>{
      cap.textContent = `${w.學員||""}　${w.作品||""}`;
      cap.style.opacity = "";
    }, 340);
  });
  setTimeout(()=>{ [...slot.children].forEach(n=>{ if(n!==el) n.remove(); }); }, 1100);
}

function 輪播(){
  clearInterval(牆計時);
  if(牆源.length <= 3) return;
  if(matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  牆計時 = setInterval(()=>{
    if(document.hidden || 現作品) return;
    const k = 牆輪++ % 3;
    let n = (牆指標[k] + 3) % 牆源.length, 保險 = 0;
    while(牆指標.includes(n) && 保險++ < 牆源.length) n = (n+1) % 牆源.length;
    牆指標[k] = n;
    換格(k, 牆源[n]);
  }, 5200);
}

function 畫牆(){
  牆源 = 作品資料.length ? 作品資料
    : [{作品:"第一件作品",圖片:[],學員:"　"},{作品:"第二件作品",圖片:[],學員:"　"},{作品:"第三件作品",圖片:[],學員:"　"}];
  牆指標 = [0,1,2].map(i => i % 牆源.length);
  $("#wall").innerHTML = 牆指標.map(()=>
    `<figure><span class="pin"></span><div class="slot"></div><figcaption></figcaption></figure>`
  ).join("");
  牆指標.forEach((i,k)=> 換格(k, 牆源[i]));
  輪播();
}

function 畫統計(){
  const 課程數 = new Set(作品資料.map(w=>w.課程)).size;
  const 影片數 = 作品資料.filter(有影片).length;
  $("#tally").innerHTML =
    `<span>收錄 <b>${作品資料.length}</b> 件作品</span>
     <span>涵蓋 <b>${課程數}</b> 個課程</span>
     <span><b>${影片數}</b> 件附成果影片</span>`;
}
function 畫篩選(){
  const 課程 = ["全部", ...new Set(作品資料.map(w=>w.課程))];
  $("#filters").innerHTML = 課程.map(c=>{
    const n = c==="全部" ? 作品資料.length : 作品資料.filter(w=>w.課程===c).length;
    return `<button class="chip" aria-pressed="${c===目前課程}" data-c="${esc(c)}">${esc(c)}<small>${n}</small></button>`;
  }).join("");
}
function 畫網格(){
  const 清單 = 目前課程==="全部" ? 作品資料 : 作品資料.filter(w=>w.課程===目前課程);
  if(!清單.length){
    $("#grid").innerHTML = 作品資料.length
      ? `<div class="empty"><b>這個課程還沒有作品</b>換一個課程看看。</div>`
      : `<div class="empty"><b>還沒有作品</b>在網址後面加上 #edit 打開表單，新增第一件作品。</div>`;
    return;
  }
  $("#grid").innerHTML = 清單.map(w=>{
    const idx = 作品資料.indexOf(w);
    const 有片 = 有影片(w);
    return `<button class="card" data-i="${idx}">
      <div class="thumb">
        ${封面(w)}
        ${有片?`<span class="play" title="直接播放影片">▶ 影片</span>`:""}
      </div>
      <div class="card-body">
        <h3>${esc(w.作品)}</h3>
        <div class="who"><b>${esc(w.學員)}</b>　${esc(w.年份||"")}</div>
        ${w.說明?`<p class="snip">${esc(w.說明)}</p>`:""}
      </div>
    </button>`;
  }).join("");
}

$("#filters").addEventListener("click",e=>{
  const b = e.target.closest(".chip"); if(!b) return;
  目前課程 = b.dataset.c; 畫篩選(); 畫網格();
});
$("#grid").addEventListener("click",e=>{
  const c = e.target.closest(".card"); if(!c) return;
  const i = +c.dataset.i;
  if(e.target.closest(".play")){
    const k = 投影片(作品資料[i]).findIndex(s=>s.型==="影");
    開啟(i, k<0 ? 0 : k);
  } else {
    開啟(i);
  }
});

/* ---------- 詳細頁 ---------- */
let 現作品 = null, 現片 = [], 現頁 = 0, 回焦點 = null;

function 開啟(i, 起始=0){
  現作品 = 作品資料[i];
  現片 = 投影片(現作品);
  現頁 = Math.max(0, Math.min(起始, 現片.length-1));
  回焦點 = document.activeElement;
  $("#veil").classList.add("on");
  document.body.classList.add("locked");
  畫面板(); 畫舞台();
  $("#shut").focus();
}
function 關閉(){
  $("#veil").classList.remove("on");
  document.body.classList.remove("locked");
  $("#shot-slot").innerHTML = "";
  現作品 = null; 現片 = [];
  if(回焦點) 回焦點.focus();
}
function 畫舞台(){
  const w = 現作品, n = 現片.length, s = 現片[現頁];
  $("#shot-slot").innerHTML = !s ? 底圖(w.作品, w.作品)
    : s.型==="圖"
      ? 縮圖(w, 現頁, "shot")
      : `<button class="tube" data-v="${s.值}">
           <img src="https://i.ytimg.com/vi/${s.值}/hqdefault.jpg" alt="">
           <span class="btn">▶ 播放影片</span>
         </button>`;
  const 多 = n > 1;
  $("#prev").disabled = 現頁<=0;
  $("#next").disabled = 現頁>=n-1;
  $("#prev").style.visibility = 多?"visible":"hidden";
  $("#next").style.visibility = 多?"visible":"hidden";
  $("#counter").textContent = 多 ? `${現頁+1} / ${n}` : "";
  $("#strip").innerHTML = 多 ? 現片.map((t,k)=>{
    const 內 = t.型==="圖"
      ? 縮圖(w,k)
      : `<img src="https://i.ytimg.com/vi/${t.值}/hqdefault.jpg" alt="">`;
    return `<button data-k="${k}" aria-current="${k===現頁}" aria-label="第 ${k+1} 項">
      ${內}${t.型==="影"?'<span class="vmark">▶</span>':''}</button>`;
  }).join("") : "";
}
function 畫面板(){
  const w = 現作品;
  $("#panel").innerHTML = `
    <span class="tag">${esc(w.課程)}</span>
    <h2>${esc(w.作品)}</h2>
    <p class="who"><b>${esc(w.學員)}</b>　${esc(w.年份||"")}</p>
    ${w.說明?`<p class="desc">${esc(w.說明)}</p>`:""}`;
}
function 翻(d){
  const t = 現頁 + d;
  if(t<0 || t>=現片.length) return;
  現頁 = t; 畫舞台();
}

$("#solo").onclick = ()=>{
  const on = $("#veil").classList.toggle("focusmode");
  $("#solo").textContent = on ? "⤡ 展開文案" : "⤢ 收合文案";
};
$("#prev").onclick = ()=>翻(-1);
$("#next").onclick = ()=>翻(1);
$("#shut").onclick = 關閉;
$("#strip").addEventListener("click",e=>{
  const b = e.target.closest("button"); if(!b) return;
  現頁 = +b.dataset.k; 畫舞台();
});
$("#shot-slot").addEventListener("click",e=>{
  const t = e.target.closest(".tube"); if(!t) return;
  t.outerHTML = `<iframe class="shot-video" src="https://www.youtube.com/embed/${t.dataset.v}?autoplay=1&rel=0"
    allow="accelerometer;autoplay;clipboard-write;encrypted-media;picture-in-picture" allowfullscreen></iframe>`;
});
$("#veil").addEventListener("click",e=>{ if(e.target.id==="veil") 關閉(); });
document.addEventListener("keydown",e=>{
  if(!現作品) return;
  if(e.key==="Escape") 關閉();
  if(e.key==="ArrowLeft") 翻(-1);
  if(e.key==="ArrowRight") 翻(1);
});
let x0=null;
$(".stage").addEventListener("touchstart",e=>{x0=e.touches[0].clientX},{passive:true});
$(".stage").addEventListener("touchend",e=>{
  if(x0===null) return;
  const dx = e.changedTouches[0].clientX - x0;
  if(Math.abs(dx)>44) 翻(dx<0?1:-1);
  x0=null;
},{passive:true});

/* ---------- 新增作品表單 ---------- */
function 檢查編輯模式(){
  $("#admin").classList.toggle("on", location.hash==="#edit");
}
window.addEventListener("hashchange",檢查編輯模式);
檢查編輯模式();

$("#gen").onclick = ()=>{
  const v = id => $("#"+id).value.trim();
  const 圖 = v("f-imgs").split("\n").map(s=>s.trim()).filter(Boolean);
  const q = s => JSON.stringify(s);
  const code =
`  {
    作品: ${q(v("f-title")||"未命名作品")},
    學員: ${q(v("f-name"))},
    課程: ${q(v("f-course")||"其他")},
    年份: ${q(v("f-year"))},
    說明: ${q(v("f-desc"))},
    影片: [${v("f-video").split("\n").map(s=>影片ID(s.trim())).filter(Boolean).map(q).join(",")}],
    圖片: [${圖.map(q).join(",")}]
  },`;
  const out = $("#out");
  out.textContent = code;
  out.classList.add("on");
  navigator.clipboard?.writeText(code).catch(()=>{});
  out.scrollIntoView({behavior:"smooth",block:"nearest"});
};

畫牆(); 畫統計(); 畫篩選(); 畫網格();
